<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能对话系统</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <script src="https://unpkg.com/element-plus"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .chat-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            height: 90vh;
            display: flex;
            flex-direction: column;
        }
        
        .chat-header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
        }
        
        .user-message {
            justify-content: flex-end;
        }
        
        .ai-message {
            justify-content: flex-start;
        }
        
        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }
        
        .user-bubble {
            background: #007bff;
            color: white;
        }
        
        .ai-bubble {
            background: white;
            border: 1px solid #e9ecef;
        }
        
        .chat-input {
            padding: 20px;
            border-top: 1px solid #e9ecef;
            background: white;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .input-main {
            flex: 1;
            min-width: 0;
            max-width: none;
        }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .upload-status {
            margin-bottom: 8px;
            color: #606266;
            font-size: 13px;
        }

        .file-actions {
            margin-bottom: 8px;
            display: flex;
            gap: 8px;
        }

        .file-chip-wrap {
            margin-bottom: 8px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .citation-list {
            margin-top: 8px;
            border-top: 1px dashed #dcdfe6;
            padding-top: 8px;
            font-size: 12px;
            color: #606266;
        }

        .citation-item {
            margin-top: 4px;
            line-height: 1.4;
        }
        
        .typing-indicator {
            display: flex;
            align-items: center;
            color: #6c757d;
            font-style: italic;
        }
        
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6c757d;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out;
        }
        
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    {% raw %}
    <div id="app">
        <div class="chat-container">
            <div class="chat-header">
                <h2>🤖 AI智能对话系统</h2>
                <p>基于Python和AI大模型的智能对话应用</p>
            </div>
            
            <div class="chat-messages" ref="messagesContainer">
                <div v-for="message in messages" :key="message.id" 
                     :class="['message', message.role === 'user' ? 'user-message' : 'ai-message']">
                    <div :class="['message-bubble', message.role === 'user' ? 'user-bubble' : 'ai-bubble']">
                        <div v-if="message.role === 'user'">
                            <strong>你:</strong> <span v-text="message.content"></span>
                        </div>
                        <div v-else>
                            <strong>AI助手:</strong> 
                            <span v-if="message.isTyping" class="typing-indicator">
                                <span class="dot"></span>
                                <span class="dot"></span>
                                <span class="dot"></span>
                            </span>
                            <span v-else v-text="message.content"></span>
                            <div v-if="message.citations && message.citations.length" class="citation-list">
                                <div><strong>参考资料：</strong></div>
                                <div v-for="citation in message.citations" :key="citation.id" class="citation-item">
                                    [{{ citation.id }}] {{ citation.filename }} - {{ citation.snippet }}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="chat-input">
                <div v-if="uploadedFiles.length" class="upload-status">
                    已上传资料（{{ uploadedFiles.length }}）
                </div>
                <div v-if="uploadedFiles.length" class="file-chip-wrap">
                    <el-tag
                        v-for="filename in uploadedFiles"
                        :key="filename"
                        closable
                        @close="deleteUploadedFile(filename)"
                    >
                        {{ filename }}
                    </el-tag>
                </div>
                <div class="file-actions">
                    <el-button size="small" @click="refreshUploadedFiles">刷新文件列表</el-button>
                    <el-button size="small" @click="reindexFiles" :loading="isReindexing">重建索引</el-button>
                </div>
                <div class="input-row">
                    <el-input
                        class="input-main"
                        v-model="inputMessage"
                        placeholder="输入你的问题..."
                        @keyup.enter="sendMessage"
                        :disabled="isLoading"
                    ></el-input>
                    <input
                        ref="fileInput"
                        type="file"
                        multiple
                        style="display: none;"
                        accept=".txt,.md,.csv,.json,.pdf,.py,.log"
                        @change="onFileSelected"
                    />
                    <div class="input-actions">
                        <el-button
                            @click="triggerFileSelect"
                            :loading="isUploading"
                        >
                            📎 添加文件
                        </el-button>
                        <el-button
                            @click="sendMessage"
                            :loading="isLoading"
                            type="primary"
                        >
                            发送
                        </el-button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    {% endraw %}
 
    <script>
        const { createApp, ref, onMounted, nextTick } = Vue;
        const { ElMessage } = ElementPlus;
        
        createApp({
            setup() {
                const messages = ref([]);
                const inputMessage = ref('');
                const isLoading = ref(false);
                const isUploading = ref(false);
                const isReindexing = ref(false);
                const sessionId = ref('');
                const messagesContainer = ref(null);
                const fileInput = ref(null);
                const uploadedFiles = ref([]);
                
                // 初始化会话ID
                if (!sessionId.value) {
                    sessionId.value = generateSessionId();
                    loadChatHistory();
                    refreshUploadedFiles();
                }
                
                function generateSessionId() {
                    return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                }
                
                async function loadChatHistory() {
                    try {
                        const response = await fetch(`/api/chat/history/${sessionId.value}`);
                        if (response.ok) {
                            const history = await response.json();
                            messages.value = history.map(item => ({
                                id: item.id,
                                role: 'user',
                                content: item.user_message,
                                timestamp: item.created_at
                            })).concat(history.map(item => ({
                                id: item.id + '_ai',
                                role: 'assistant',
                                content: item.ai_response,
                                timestamp: item.created_at
                            }))).sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
                            
                            scrollToBottom();
                        }
                    } catch (error) {
                        console.error('加载聊天历史失败:', error);
                    }
                }
                
                async function sendMessage() {
                    if (!inputMessage.value.trim() || isLoading.value) return;
                    
                    const userMessage = inputMessage.value.trim();
                    inputMessage.value = '';
                    
                    // 添加用户消息
                    const userMsg = {
                        id: Date.now(),
                        role: 'user',
                        content: userMessage,
                        timestamp: new Date().toISOString()
                    };
                    messages.value.push(userMsg);
                    
                    // 添加AI响应占位符
                    const aiMsg = {
                        id: Date.now() + 1,
                        role: 'assistant',
                        content: '',
                        isTyping: true,
                        timestamp: new Date().toISOString()
                    };
                    messages.value.push(aiMsg);
                    
                    scrollToBottom();
                    isLoading.value = true;
                    
                    try {
                        const response = await fetch('/api/chat/message', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                message: userMessage,
                                session_id: sessionId.value
                            })
                        });
                        
                        if (response.ok) {
                            const data = await response.json();
                            aiMsg.content = data.ai_response;
                            aiMsg.isTyping = false;
                            aiMsg.citations = data.citations || [];
                        } else {
                            throw new Error('发送消息失败');
                        }
                    } catch (error) {
                        aiMsg.content = '抱歉，发生错误：' + error.message;
                        aiMsg.isTyping = false;
                        ElMessage.error('发送消息失败');
                    } finally {
                        isLoading.value = false;
                        scrollToBottom();
                    }
                }

                function triggerFileSelect() {
                    if (isUploading.value || isLoading.value) return;
                    fileInput.value?.click();
                }

                async function onFileSelected(event) {
                    const files = event.target.files;
                    if (!files || !files.length) return;

                    const formData = new FormData();
                    formData.append('session_id', sessionId.value);
                    Array.from(files).forEach(file => formData.append('files', file));

                    isUploading.value = true;
                    try {
                        const response = await fetch('/api/chat/upload', {
                            method: 'POST',
                            body: formData
                        });

                        if (!response.ok) {
                            const err = await response.json().catch(() => ({}));
                            throw new Error(err.detail || '文件上传失败');
                        }

                        const data = await response.json();
                        uploadedFiles.value = Array.from(new Set([...(data.uploaded_files || [])]));
                        ElMessage.success(`上传成功，已索引 ${data.indexed_chunks} 个文本片段`);
                        await refreshUploadedFiles();
                    } catch (error) {
                        ElMessage.error(error.message || '文件上传失败');
                    } finally {
                        isUploading.value = false;
                        event.target.value = '';
                    }
                }

                async function refreshUploadedFiles() {
                    try {
                        const response = await fetch(`/api/chat/files/${sessionId.value}`);
                        if (!response.ok) {
                            return;
                        }
                        const data = await response.json();
                        uploadedFiles.value = (data.files || []).map(item => item.filename);
                    } catch (error) {
                        console.error('获取文件列表失败:', error);
                    }
                }

                async function deleteUploadedFile(filename) {
                    try {
                        const response = await fetch(
                            `/api/chat/files/${sessionId.value}?filename=${encodeURIComponent(filename)}`,
                            { method: 'DELETE' }
                        );
                        if (!response.ok) {
                            const err = await response.json().catch(() => ({}));
                            throw new Error(err.detail || '删除文件失败');
                        }
                        uploadedFiles.value = uploadedFiles.value.filter(f => f !== filename);
                        ElMessage.success(`已删除文件：${filename}`);
                    } catch (error) {
                        ElMessage.error(error.message || '删除文件失败');
                    }
                }

                async function reindexFiles() {
                    isReindexing.value = true;
                    try {
                        const response = await fetch(`/api/chat/files/${sessionId.value}/reindex`, {
                            method: 'POST'
                        });
                        if (!response.ok) {
                            const err = await response.json().catch(() => ({}));
                            throw new Error(err.detail || '重建索引失败');
                        }
                        const data = await response.json();
                        ElMessage.success(`重建索引完成，共 ${data.indexed_chunks} 个片段`);
                    } catch (error) {
                        ElMessage.error(error.message || '重建索引失败');
                    } finally {
                        isReindexing.value = false;
                    }
                }
                
                function scrollToBottom() {
                    nextTick(() => {
                        if (messagesContainer.value) {
                            messagesContainer.value.scrollTop = messagesContainer.value.scrollHeight;
                        }
                    });
                }
                
                onMounted(() => {
                    scrollToBottom();
                });
                
                return {
                    messages,
                    inputMessage,
                    isLoading,
                    isUploading,
                    isReindexing,
                    messagesContainer,
                    fileInput,
                    uploadedFiles,
                    sendMessage,
                    triggerFileSelect,
                    onFileSelected,
                    refreshUploadedFiles,
                    deleteUploadedFile,
                    reindexFiles
                };
            }
        }).use(ElementPlus).mount('#app');
    </script>
</body>
</html>
